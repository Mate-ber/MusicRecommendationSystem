[project]
name = "music-recommendation-system"
version = "0.1.0"
description = "Music recommendations from implicit listening data with ALS, and analysis of the learned embedding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "implicit>=0.7.3",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "polars>=1.42.1",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "tqdm>=4.68.4",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "python-pptx>=1.0.2",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
